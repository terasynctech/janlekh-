<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>जनलेख | जनता की आवाज़</title>

  <link rel="icon" href="assets/logo.png" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="container d-flex justify-content-between align-items-center">
      <div id="currentDate">25 जुलाई 2026</div>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-x-twitter"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="main-header">
    <div class="container">
      <div class="header-wrapper">

        <a href="#" class="logo">
          <img src="assets/logo.png" alt="Janlekh Logo">
        </a>

        <nav class="main-nav">
          <a href="#">होम</a>
          <a href="#">ताज़ा समाचार</a>
          <a href="#">झारखण्ड</a>
          <a href="#">भारत</a>
          <a href="#">विश्व</a>
          <a href="#">विचार</a>
          <a href="#">वीडियो</a>
          <a href="#">संपर्क</a>
        </nav>

        <div class="header-actions">
          <button class="search-btn"><i class="fas fa-search"></i></button>
          <button class="theme-btn"><i class="fas fa-moon"></i></button>
          <button class="menu-btn"><i class="fas fa-bars"></i></button>
        </div>

      </div>
    </div>
  </header>

  <!-- Breaking News -->
  <section class="breaking-news">
    <div class="container">
      <div class="breaking-wrapper">
        <span class="breaking-label">ब्रेकिंग न्यूज़</span>
        <div class="breaking-ticker">
          <div class="ticker-track">
            झारखण्ड की ताज़ा खबरें • भारत • विश्व • राजनीति • शिक्षा • व्यापार • तकनीक • खेल • मनोरंजन • स्वास्थ्य
          </div>
        </div>
      </div>
    </div>
  </section>

<!-- ================= HERO SLIDER ================= -->

<section class="hero-slider">

    <div id="heroSlider">

        <!-- Hero Slider Will Load Automatically -->

    </div>

</section>
 <!-- Latest News -->
<section class="latest-news section-padding">
    <div class="container">

        <div class="section-header">
            <h2>ताज़ा समाचार</h2>
            <p>Janlekh से नवीनतम समाचार</p>
        </div>

        <div class="row g-4" id="latestNews">
            <!-- News cards will be loaded automatically -->
        </div>

    </div>
</section>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="container text-center">
      <img src="assets/logo.png" alt="Janlekh" class="footer-logo">
      <p class="mt-3">© 2026 जनलेख | जनता की आवाज़</p>
    </div>
  </footer>

   <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="js/app.js"></script>
  <script src="js/news.js"></script>
  <script src="js/slider.js"></script>

</body>
</html>
